<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:linear-gradient(to right,#4facfe,#00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:350px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:#4facfe;
            border:none;
            color:white;
            font-size:18px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#008cff;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>User Registration</h2>

    <form action="saveUser.jsp" method="post">

        <input type="number" name="id" placeholder="Enter ID" required>

        <input type="text" name="name" placeholder="Enter Name" required>

        <button type="submit">Save User</button>

    </form>

</div>

</body>
</html>
